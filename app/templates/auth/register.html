<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ForensiCore - Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <style>

        body {
            background: #0b1220;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }


        .register-card {
            width: 430px;
            background: #111827;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(0,0,0,0.5);
        }


        .brand {
            color: #38bdf8;
            font-size: 28px;
            font-weight: bold;
        }


        .btn-register {

            background: #38bdf8;
            border: none;
            color: black;
            font-weight: bold;

        }


        .btn-register:hover {

            background: #0ea5e9;

        }

    </style>

</head>


<body>


<div class="register-card">


    <div class="text-center mb-4">

        <div class="brand">
            ForensiCore
        </div>

        <p class="text-secondary">
            Create Investigator Account
        </p>

    </div>



    <form>


        <div class="mb-3">

            <label class="form-label">
                Full Name
            </label>

            <input type="text"
                   class="form-control"
                   placeholder="Enter full name">

        </div>



        <div class="mb-3">

            <label class="form-label">
                Email
            </label>

            <input type="email"
                   class="form-control"
                   placeholder="Enter email">

        </div>




        <div class="mb-3">

            <label class="form-label">
                Password
            </label>

            <input type="password"
                   class="form-control"
                   placeholder="Create password">

        </div>




        <button class="btn btn-register w-100">

            Create Account

        </button>



    </form>


</div>


</body>

</html>
