<!DOCTYPE html>
<html>

<head>

<title>Email Forensic Analyzer</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>


<body>


<div class="container mt-5">


<h2>Email Forensic Analyzer</h2>

<hr>



<form method="POST" 
action="/email/analyze"
enctype="multipart/form-data">



<!-- EML Upload -->


<h4>

Upload Email Evidence (.eml)

</h4>


<label class="form-label">

Select .eml File

</label>


<input

type="file"

name="email_file"

class="form-control"

accept=".eml"

>


<br>


<hr>


<h4>

OR

</h4>



<!-- Header Paste -->


<label class="form-label">

Paste Complete Email Header

</label>


<textarea

name="email_header"

class="form-control"

rows="15"

placeholder="Paste Email Header Here..."

></textarea>



<br>



<button class="btn btn-primary">

Analyze Email

</button>



</form>



</div>


</body>


</html>
