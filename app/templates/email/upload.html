<!DOCTYPE html>
<html>

<head>

<title>Email Forensic Analyzer</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>


<body>


<div class="container mt-5">


<h2>Email Forensic Analysis</h2>

<hr>



<form 
method="POST"
action="/email/analyze"
enctype="multipart/form-data">



<!-- EMl Upload -->

<h4>
Upload Email Evidence (.eml)
</h4>


<label class="form-label">

Select Email File

</label>


<input

type="file"

name="email_file"

class="form-control"

accept=".eml">


<br>


<div class="text-center">

<b>OR</b>

</div>


<br>



<!-- Header Paste -->


<h4>

Paste Email Header

</h4>



<textarea

name="email_header"

class="form-control"

rows="15"

placeholder="Paste complete email header here...">

</textarea>



<br>



<button

type="submit"

class="btn btn-primary">

Analyze Email

</button>



</form>



</div>


</body>


</html>
