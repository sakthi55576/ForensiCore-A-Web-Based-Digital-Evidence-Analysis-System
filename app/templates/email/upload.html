<!DOCTYPE html>
<html>

<head>

<title>Email Header Analyzer</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2>Email Header Analyzer</h2>

<hr>

<form method="POST" action="/email/analyze">

<label class="form-label">
Paste Complete Email Header
</label>

<textarea
name="email_header"
class="form-control"
rows="18"
placeholder="Paste Email Header Here..."
required></textarea>

<br>

<button class="btn btn-primary">
Analyze Header
</button>

</form>

</div>

</body>

</html>
