<!DOCTYPE html>
<html>

<head>

    <title>Metadata Analyzer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <h2>Metadata Analyzer</h2>

    <hr>

    <form action="/metadata/analyze" method="POST" enctype="multipart/form-data">

        <div class="mb-3">

            <label class="form-label">
                Select Evidence File
            </label>

            <input
                type="file"
                name="evidence"
                class="form-control"
                required>

        </div>

        <button class="btn btn-primary">

            Analyze Metadata

        </button>

    </form>

</div>

</body>

</html>
