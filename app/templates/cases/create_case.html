<!DOCTYPE html>
<html>

<head>

<title>Create Case</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>


<body>


<div class="container mt-5">


<h2>Create Investigation Case</h2>


<form method="POST">

<div class="mb-3">

<label>Case Number</label>

<input 
type="text"
class="form-control"
value="{{ case_number }}"
readonly>

</div>


<div class="mb-3">

<label>Case Title</label>

<input 
type="text"
name="case_title"
class="form-control"
required>

</div>



<div class="mb-3">

<label>Investigator Name</label>

<input 
type="text"
name="investigator_name"
class="form-control"
required>

</div>



<div class="mb-3">

<label>Case Summary</label>

<textarea
name="case_summary"
class="form-control"
rows="5"></textarea>

</div>



<button class="btn btn-primary">

Create Case

</button>


</form>


</div>


</body>
