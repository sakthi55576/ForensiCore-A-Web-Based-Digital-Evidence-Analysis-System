<!DOCTYPE html>
<html>

<head>

<title>Case Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>


<body>


<div class="container mt-5">


<div class="d-flex justify-content-between align-items-center">

<h2>Investigation Cases</h2>

<a href="/cases/create" class="btn btn-primary">
Create New Case
</a>

</div>


<hr>


<table class="table table-bordered table-striped">


<thead>

<tr>

<th>Case Number</th>

<th>Case Title</th>

<th>Investigator</th>

<th>Status</th>

<th>Created Date</th>

<th>Action</th>

</tr>

</thead>


<tbody>


{% for case in cases %}


<tr>

<td>
{{ case.case_number }}
</td>


<td>
{{ case.case_title }}
</td>


<td>
{{ case.investigator_name }}
</td>


<td>

<span class="badge bg-success">

{{ case.status }}

</span>

</td>


<td>
{{ case.created_at.strftime('%d-%m-%Y') }}
</td>


<td>

<a href="/cases/{{ case.id }}" class="btn btn-sm btn-dark">

View

</a>

</td>

</tr>


{% endfor %}


</tbody>


</table>


</div>


</body>

</html>
