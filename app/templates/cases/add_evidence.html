<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Evidence | ForensiCore</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body>

<div class="container mt-5">

    <!-- Header -->

    <div class="mb-4">

        <h2 class="fw-bold">
            Add Digital Evidence
        </h2>

        <p class="text-muted">
            Upload evidence for case
            <strong>{{ case.case_number }}</strong>
        </p>

    </div>


    <!-- Upload Card -->

    <div class="card shadow-sm">

        <div class="card-body p-4">

            <form
                method="POST"
                enctype="multipart/form-data"
            >

                <div class="mb-4">

                    <label
                        for="evidence"
                        class="form-label fw-bold"
                    >
                        Select Evidence File
                    </label>

                    <input
                        type="file"
                        class="form-control"
                        id="evidence"
                        name="evidence"
                        required
                    >

                    <div class="form-text">

                        Supported types:
                        JPG, JPEG, PNG, TIFF,
                        EML, DB, SQLite, CSV,
                        TXT, JSON and HTML.

                    </div>

                </div>


                <!-- Case Information -->

                <div class="alert alert-info">

                    <strong>Case:</strong>
                    {{ case.case_number }}

                    <br>

                    <strong>Title:</strong>
                    {{ case.case_title }}

                </div>


                <!-- Buttons -->

                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Upload Evidence
                    </button>


                    <a
                        href="{{ url_for(
                            'cases.case_details',
                            case_id=case.id
                        ) }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>

</html>
