<!DOCTYPE html>
<html>

<head>

<title>Full Browser History</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet"
>

</head>

<body>

<div class="container mt-5">

<h2>
Full Browser History
</h2>

<p class="text-muted">

Total Records:
{{ history_data["Total URLs"] }}

</p>

<hr>


<div
style="
max-height: 650px;
overflow-y: auto;
"
>

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>
#
</th>

<th>
URL
</th>

<th>
Title
</th>

<th>
Visit Count
</th>

<th>
Last Visit
</th>

</tr>

</thead>

<tbody>

{% for item in history_data["History"] %}

<tr>

<td>
{{ loop.index }}
</td>

<td style="word-break:break-all;">
{{ item["URL"] }}
</td>

<td>
{{ item["Title"] }}
</td>

<td>
{{ item["Visit Count"] }}
</td>

<td>
{{ item["Last Visit"] }}
</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>


<div class="mt-4">

<a
href="/browser/"
class="btn btn-secondary"
>

Analyze Another History

</a>

</div>


</div>

</body>

</html>
